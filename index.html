  header .feedback-link {
    font-size: 12px;

    text-decoration: none;
    margin-left: auto;
    white-space: nowrap;
  }
  header .feedback-link:hover { background: #1642B0; }

  #main { flex: 1; display: flex; min-height: 0; position: relative; }

  #sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px;
  }
  #sheet-handle { display: none; }
  #sheet-feedback { display: none; }

  #sidebar-meta {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
  #sidebar-meta .note { font-size: 12px; color: var(--text-muted); }
  #sidebar-meta .badge {
    font-size: 12px;
    color: var(--text-secondary);
    background: #f0efec;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .legend-group {
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .legend-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 6px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    outline: none;
  }
  .legend-group-header:hover { background: #f5f4f1; }
  .legend-group-header:focus-visible { box-shadow: 0 0 0 2px var(--border) inset; }

  .legend-group-title {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-primary);
    flex: 1;
  }
  .legend-group-count { font-size: 12px; color: var(--text-muted); }
  .legend-group-chevron {
    width: 14px; height: 14px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    transition: transform 0.15s;
  }
  .legend-group.expanded .legend-group-chevron { transform: rotate(90deg); }

  .legend-group-rows {
    display: none;
    padding: 2px 0 6px;
  }
  .legend-group.expanded .legend-group-rows { display: block; }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 6px 7px 22px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    outline: none;
  }
  .legend-row:hover { background: #f5f4f1; }
  .legend-row:focus-visible { box-shadow: 0 0 0 2px var(--border) inset; }

  .legend-dot {
    --dot-color: #999;
    width: 13px; height: 13px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1.5px solid var(--dot-color);
    background: var(--dot-color);
    transition: background 0.15s, opacity 0.15s;
  }
  .legend-row[aria-checked="false"] .legend-dot { background: transparent; }
  .legend-row[aria-checked="false"] .legend-label,
  .legend-row[aria-checked="false"] .legend-count { opacity: 0.4; }

  .legend-label { font-size: 14px; flex: 1; }
  .legend-count { font-size: 12px; color: var(--text-muted); }

  .fac-group-title {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 14px 0 4px;
    padding: 0 6px;
  }
  .fac-list { margin-top: 16px; }
  .fac-item { padding: 8px 6px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; }
  .fac-item:hover { background: #f5f4f1; }
  .fac-item .name { font-weight: 400; }
  .fac-item .addr { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .fac-item .noloc-tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 400;
    color: var(--text-muted);
    background: #f0efec;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0px 5px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .fac-detail {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--border);
  }
  .fac-detail .row { font-size: 12.5px; color: var(--text-secondary); margin: 2px 0; }
  .fac-detail .row a { color: #2a78d6; }
  .fac-detail .note { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

  #map { flex: 1; }

  .popup-title { font-weight: 500; font-size: 14px; margin-bottom: 4px; }
  .popup-cat {
    display: inline-block;
    font-size: 11px;
    color: #fff;
    background: var(--series-hs);
    border-radius: 4px;
    padding: 1px 7px;
    margin-bottom: 6px;

  .popup-row { font-size: 12.5px; color: var(--text-secondary); margin: 2px 0; }
  .popup-row a { color: #2a78d6; }
  .popup-note { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 6px; }

  @media (max-width: 720px) {
    header { padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 15px; }
    header .feedback-link { display: none; }

    #main { position: relative; overflow: hidden; }
    #map { position: absolute; inset: 0; }

    /* ボトムシート：普段は地図を全画面表示し、下から少しだけ覗くハンドルを
       指で上に引き上げるとカテゴリ一覧・施設一覧が展開する（Google Maps/Airbnb方式） */
    #sidebar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      top: auto;
      height: 85vh;
      width: auto;
      max-width: none;
      background: var(--surface-2);
      border-right: none;
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -6px 24px rgba(0,0,0,0.18);
      z-index: 2000;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: translateY(calc(85vh - 64px));
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    }
    #sidebar.dragging { transition: none; }
    #sidebar.sheet-peek { transform: translateY(calc(85vh - 64px)); }
    #sidebar.sheet-half { transform: translateY(40vh); }
    #sidebar.sheet-full { transform: translateY(0); }

    #sheet-handle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 16px 10px;
      cursor: grab;
      flex-shrink: 0;
      touch-action: none;
    }
    .sheet-grip {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--border);
    }
    .sheet-summary {
      font-size: 13px;
      color: var(--text-secondary);
      width: 100%;
      text-align: center;
    }

    #sheet-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 14px 16px;
    }

    #sidebar-meta { margin-top: 10px; padding-top: 10px; }

    .legend-row { padding: 10px 8px 10px 22px; gap: 10px; }
    .legend-group-header { padding: 12px 8px; gap: 8px; }
    .legend-group-title { font-size: 14px; }
    .legend-label { font-size: 14px; }
    .legend-group-count, .legend-count { font-size: 12px; }
    .fac-item { font-size: 14px; padding: 10px 6px; }
    .fac-item .addr { font-size: 12px; }

    #sheet-feedback {
      display: flex;
      justify-content: center;
      padding: 16px 6px 8px;
    }
    #sheet-feedback .feedback-link {
      font-size: 13px;
      color: #fff;
      background: #1D4ED8;
      border-radius: 999px;
      padding: 8px 22px;
      text-decoration: none;
      white-space: nowrap;
    }
    #sheet-feedback .feedback-link:hover { background: #1642B0; }
  }

// 同一座標（住所を町丁目レベルまでしか特定できない施設が複数あるため）に立つピンを
// 少しだけ円状にずらして、重なりが分かるようにする（拠点を持たない＝lat/lonがない
// 施設はそもそも対象外）
function spreadOverlaps(data) {
  const groups = {};
  data.filter(d => d.hasLocation).forEach(d => {
    const key = d.lat.toFixed(6) + ',' + d.lon.toFixed(6);
    (groups[key] = groups[key] || []).push(d);
  });
  Object.values(groups).forEach(group => {
    if (group.length <= 1) return;
    const R = 0.00045; // 緯度1度あたり約111kmなので、約50m相当
    group.forEach((d, i) => {
      const angle = (2 * Math.PI * i) / group.length;
      d._colocatedCount = group.length;
      d.lat = d.lat + R * Math.cos(angle);
      d.lon = d.lon + (R * Math.sin(angle)) / Math.cos(d.lat * Math.PI / 180);
    });
  });
}
spreadOverlaps(DATA);

  "中学校":     { color: "#0D9488", icon: "中", weight: 400, scale: 0.8 },
  "フリースクール": { color: "#38BDF8", icon: "フ", weight: 400, scale: 0.8 },
  "高等学校":   { color: "#8B5CF6", icon: "高", weight: 400, scale: 0.8 },
  "支援センター": { color: "#E11D48", icon: "支", weight: 400, scale: 0.8 },
  "保育園":     { color: "#991B1B", icon: "保", weight: 400, scale: 0.8 },
  "小規模保育": { color: "#FC83C4", icon: "小", weight: 400, scale: 0.8 },
  "幼稚園":     { color: "#FF199E", icon: "幼", weight: 400, scale: 0.8 },
  "こども園":   { color: "#F97316", icon: "こ", weight: 400, scale: 0.8 },
  "放課後等デイサービス": { color: "#5B21B6", icon: "放", weight: 400, scale: 0.8 },
  "学習塾":     { color: "#D946EF", icon: "塾", weight: 400, scale: 0.8 },
  "学習支援・居場所": { color: "#96204F", icon: "居", weight: 400, scale: 0.8 },
  "図書館":     { color: "#D3A50E", icon: "本", weight: 400, scale: 0.8 },
  "振興センター": { color: "#EA580C", icon: "振", weight: 400, scale: 0.8 },
  "学童クラブ": { color: "#854D0E", icon: "学", weight: 400, scale: 0.8 },
  "こども食堂": { color: "#166534", icon: "食", weight: 400, scale: 0.8 },
  "産前・産後サポート": { color: "#84CC16", icon: "産", weight: 400, scale: 0.8 },
  "子育て支援サービス": { color: "#0F9B8E", icon: "子", weight: 400, scale: 0.8 },
  "あそび":     { color: "#8A9102", icon: "遊", weight: 400, scale: 0.8 }
};

function makeIcon(color, icon, weight, scale) {
  weight = weight || 700;
  scale = scale || 1;
  const html = `
    <div style="
      width:28px;height:28px;
      background:${color};
      border:2px solid #fff;
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      box-shadow:0 1px 4px rgba(0,0,0,0.35);
      display:flex;align-items:center;justify-content:center;
    ">
      <span style="
        transform:rotate(45deg) scale(${scale});
        color:#fff;font-weight:${weight};line-height:1;
        font-size:13px;
      ">${icon}</span>
    </div>`;
  return L.divIcon({
    html,
    className: "",
    iconSize: [28, 28],
    iconAnchor: [14, 28],
    popupAnchor: [0, -26]
  });
}

function shortAddress(address) {
  if (!address) return "";
  const m = address.match(/花巻市[^0-9第]+/);
  return m ? m[0] : address;
}

const ALL_CATS = CATEGORY_GROUPS.flatMap(g => g.cats);

// URLのクエリパラメータから前回の状態（選択中カテゴリ・地図の表示位置）を復元する。
// スマホでタブがメモリ節約のため再読み込みされ、選択が0に戻ってしまう問題への対策として、
// 選択カテゴリと地図の表示位置をURLに保存し、次回アクセス時に復元する。
const urlParams = new URLSearchParams(location.search);
const restoredCatsRaw = urlParams.get('cats');
const restoredCatsList = restoredCatsRaw
  ? restoredCatsRaw.split(',').filter(c => ALL_CATS.includes(c))
  : [];
const restoredLat = parseFloat(urlParams.get('lat'));
const restoredLng = parseFloat(urlParams.get('lng'));
const restoredZoom = parseFloat(urlParams.get('z'));
const hasRestoredView = !isNaN(restoredLat) && !isNaN(restoredLng) && !isNaN(restoredZoom);

const map = L.map('map', { scrollWheelZoom: true }).setView(
  hasRestoredView ? [restoredLat, restoredLng] : [39.40, 141.13],
  hasRestoredView ? restoredZoom : 11
);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// 初期状態はすべてOFF（色のない状態）から始まり、URLに保存された状態があれば後で復元する
const activeCats = new Set();

const layerGroups = {};
ALL_CATS.forEach(cat => {
  layerGroups[cat] = L.layerGroup();
});

const allMarkers = [];

DATA.forEach(d => {
  if (!d.hasLocation) return; // 拠点を持たない施設・イベントには地図ピンを作らない
  const cfg = CATEGORY_CONFIG[d.category] || { color: '#555', icon: '\ud83d\udccd' };
  const marker = L.marker([d.lat, d.lon], { icon: makeIcon(cfg.color, cfg.icon, cfg.weight, cfg.scale) });
  const gmapQuery = `${d.name} ${d.address}`.replace(/\u3012\d{3}-?\d{4}\s*/, '');
  const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(gmapQuery)}`;

  const popupHtml = `
    <div class="popup-title">${d.name}</div>
    <span class="popup-cat" style="background:${cfg.color}">${d.category}</span>
    <div class="popup-row">\ud83d\udccd <a href="${gmapUrl}" target="_blank" rel="noopener">${d.address}</a></div>
    ${d.phone ? `<div class="popup-row">\ud83d\udcde <a href="tel:${d.phone.replace(/[^0-9]/g,'')}">${d.phone}</a></div>` : ''}
    ${d.url ? `<div class="popup-row">\ud83d\udd17 <a href="${d.url}" target="_blank" rel="noopener">${d.url}</a></div>` : ''}
    ${d.instagram ? `<div class="popup-row">\ud83d\udcf7 <a href="${d.instagram}" target="_blank" rel="noopener">Instagram</a></div>` : ''}
    ${d.facebook ? `<div class="popup-row">\ud83d\udcd8 <a href="${d.facebook}" target="_blank" rel="noopener">Facebook</a></div>` : ''}
    ${d.note ? `<div class="popup-note">${d.note}</div>` : ''}
  `;

  marker.bindPopup(popupHtml);
  marker.on('click', () => { map.setView([d.lat, d.lon], 15); });
  marker.addTo(layerGroups[d.category]);
  allMarkers.push(marker);
  d._marker = marker;
});

// facility list（チェックが入っているカテゴリのみ表示。拠点を持たない施設・イベントも
// 他の施設と同じ一覧に混在させる。地図ピンがないものはクリックで詳細をその場に展開する）
const facListEl = document.getElementById('fac-list');
function renderFacList() {
  facListEl.innerHTML = '';
  ALL_CATS.forEach(cat => {
    if (!activeCats.has(cat)) return;
    const items = DATA.filter(d => d.category === cat);
    if (items.length === 0) return;
    const groupTitle = document.createElement('div');
    groupTitle.className = 'fac-group-title';
    groupTitle.textContent = cat;
    facListEl.appendChild(groupTitle);
    items.forEach(d => {
      const item = document.createElement('div');
      item.className = 'fac-item';
      const noLocTag = d.hasLocation ? '' : '<span class="noloc-tag">拠点なし</span>';
      item.innerHTML = `<div class="name">${d.name}${noLocTag}</div><div class="addr">${shortAddress(d.address)}</div>`;

      if (d.hasLocation) {
        item.addEventListener('click', () => {
          map.setView([d.lat, d.lon], 16);
          d._marker.openPopup();
          if (isMobileViewport()) setSheetState('sheet-peek');
        });
      } else {
        // 拠点がなく地図ピンを持たない施設・イベントは、クリックで詳細をその場に展開する
        const detail = document.createElement('div');
        detail.className = 'fac-detail';
        detail.style.display = 'none';
        detail.innerHTML = `
          ${d.phone ? `<div class="row">\ud83d\udcde <a href="tel:${d.phone.replace(/[^0-9]/g,'')}">${d.phone}</a></div>` : ''}
          ${d.url ? `<div class="row">\ud83d\udd17 <a href="${d.url}" target="_blank" rel="noopener">${d.url}</a></div>` : ''}
          ${d.instagram ? `<div class="row">\ud83d\udcf7 <a href="${d.instagram}" target="_blank" rel="noopener">Instagram</a></div>` : ''}
          ${d.facebook ? `<div class="row">\ud83d\udcd8 <a href="${d.facebook}" target="_blank" rel="noopener">Facebook</a></div>` : ''}
          ${d.note ? `<div class="note">${d.note}</div>` : ''}
        `;
        item.appendChild(detail);
        item.addEventListener('click', () => {
          detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
        });
      }
      facListEl.appendChild(item);
    });
  });
}

// legend（プルダウン式：大カテゴリのヘッダーをクリックすると、その中の小カテゴリ行が開閉する。
// 小カテゴリ行はアクセシブルなカスタムトグル行。四角チェックボックスは使わず、色付きドットの塗り／枠だけで状態を示す）
const legendEl = document.getElementById('legend');
const catRowMap = {};
function toggleCategory(cat, row) {
  const nowChecked = row.getAttribute('aria-checked') !== 'true';
  row.setAttribute('aria-checked', String(nowChecked));
  if (nowChecked) {
    map.addLayer(layerGroups[cat]);
    activeCats.add(cat);
  } else {
    map.removeLayer(layerGroups[cat]);
    activeCats.delete(cat);
  }
  renderFacList();
  updateSheetSummary();
  syncStateToURL();
}

function toggleGroup(groupEl) {
  groupEl.classList.toggle('expanded');
}

CATEGORY_GROUPS.forEach((group, idx) => {
  const groupEl = document.createElement('div');
  groupEl.className = 'legend-group';
  if (group.borderColor) {
    groupEl.style.borderColor = group.borderColor;
  }

  const header = document.createElement('div');
  header.className = 'legend-group-header';
  header.setAttribute('role', 'button');
  header.setAttribute('tabindex', '0');
  header.setAttribute('aria-expanded', 'false');

  const chevron = document.createElement('span');
  chevron.className = 'legend-group-chevron';
  chevron.textContent = '\u203a';

  const titleSpan = document.createElement('span');
  titleSpan.className = 'legend-group-title';
  titleSpan.textContent = group.title;
  if (group.borderColor) {
    titleSpan.style.color = group.borderColor;
  }

  const groupCount = group.cats.reduce((sum, cat) => sum + DATA.filter(d => d.category === cat).length, 0);
  const countSpan = document.createElement('span');
  countSpan.className = 'legend-group-count';
  countSpan.textContent = groupCount;

  header.appendChild(chevron);
  header.appendChild(titleSpan);
  header.appendChild(countSpan);
  groupEl.appendChild(header);

  const rowsEl = document.createElement('div');
  rowsEl.className = 'legend-group-rows';

  group.cats.forEach(cat => {
    const cfg = CATEGORY_CONFIG[cat];
    const count = DATA.filter(d => d.category === cat).length;

    const row = document.createElement('div');
    row.className = 'legend-row';
    row.setAttribute('role', 'checkbox');
    row.setAttribute('aria-checked', 'false');
    row.setAttribute('tabindex', '0');

    const dot = document.createElement('span');
    dot.className = 'legend-dot';
    dot.style.setProperty('--dot-color', cfg.color);
    dot.style.cursor = 'pointer';

    const labelSpan = document.createElement('span');
    labelSpan.className = 'legend-label';
    labelSpan.textContent = cat;

    const countSpan2 = document.createElement('span');
    countSpan2.className = 'legend-count';
    countSpan2.textContent = count;

    row.appendChild(dot);
    row.appendChild(labelSpan);
    row.appendChild(countSpan2);
    rowsEl.appendChild(row);
    catRowMap[cat] = row;

    // 行全体をクリック（タップ）するとオン/オフが切り替わる。
    // タッチ端末はhoverイベントが発生しないため、行全体をタップ対象にする。
    row.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleCategory(cat, row);
    });
    row.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
        toggleCategory(cat, row);
      }
    });
  });

  groupEl.appendChild(rowsEl);
  legendEl.appendChild(groupEl);

  header.addEventListener('click', () => {
    toggleGroup(groupEl);
    header.setAttribute('aria-expanded', String(groupEl.classList.contains('expanded')));
  });
  header.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      toggleGroup(groupEl);
      header.setAttribute('aria-expanded', String(groupEl.classList.contains('expanded')));
    }
  });

  // 最初のグループだけ初期状態で開いておく（使い方が分かりやすいように）
  if (idx === 0) {
    groupEl.classList.add('expanded');
    header.setAttribute('aria-expanded', 'true');
  }
});

// 地図の表示位置もURLに保存し、次回アクセス時に復元できるようにする
function syncStateToURL() {
  const params = new URLSearchParams();
  if (activeCats.size > 0) {
    params.set('cats', Array.from(activeCats).join(','));
  }
  const c = map.getCenter();
  params.set('lat', c.lat.toFixed(5));
  params.set('lng', c.lng.toFixed(5));
  params.set('z', map.getZoom());
  const qs = params.toString();
  const newUrl = location.pathname + (qs ? '?' + qs : '') + location.hash;
  history.replaceState(null, '', newUrl);
}

let moveendTimer = null;
map.on('moveend', () => {
  clearTimeout(moveendTimer);
  moveendTimer = setTimeout(syncStateToURL, 300);
});

// ボトムシート（スマホ用）：ハンドルをドラッグ／タップして peek（覗く）・half（半分）・
// full（全開）の3段階を切り替える。Google Maps / Airbnb のボトムシートと同じ操作感。
function isMobileViewport() {
  return window.matchMedia('(max-width: 720px)').matches;
}

const sidebarEl = document.getElementById('sidebar');
const sheetHandle = document.getElementById('sheet-handle');
const sheetSummaryEl = document.getElementById('sheet-summary');
const SHEET_STATES = ['sheet-peek', 'sheet-half', 'sheet-full'];
let sheetState = 'sheet-peek';

function sheetPxForState(state) {
  const vh = window.innerHeight;
  const sheetH = vh * 0.85;
  if (state === 'sheet-peek') return sheetH - 64;
  if (state === 'sheet-half') return sheetH - vh * 0.45;
  return 0;
}

function setSheetState(state) {
  sheetState = state;
  SHEET_STATES.forEach(s => sidebarEl.classList.remove(s));
  sidebarEl.classList.add(state);
  sidebarEl.style.transform = '';
}

function updateSheetSummary() {
  if (!sheetSummaryEl) return;
  sheetSummaryEl.textContent = activeCats.size > 0
    ? `${activeCats.size}件のカテゴリを表示中（タップで詳細）`
    : '上にスワイプしてカテゴリを選択';
}
updateSheetSummary();

if (sidebarEl && sheetHandle) {
  setSheetState('sheet-peek');

  let dragging = false;
  let dragStartY = 0;
  let dragStartPx = 0;
  let lastPx = 0;

  sheetHandle.addEventListener('pointerdown', (e) => {
    dragging = true;
    dragStartY = e.clientY;
    dragStartPx = sheetPxForState(sheetState);
    lastPx = dragStartPx;
    sidebarEl.classList.add('dragging');
    try { sheetHandle.setPointerCapture(e.pointerId); } catch (err) {}
  });

  sheetHandle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dy = e.clientY - dragStartY;
    const sheetH = window.innerHeight * 0.85;
    let next = dragStartPx + dy;
    next = Math.max(0, Math.min(sheetH, next));
    lastPx = next;
    sidebarEl.style.transform = `translateY(${next}px)`;
  });

  function endSheetDrag(e) {
    if (!dragging) return;
    dragging = false;
    sidebarEl.classList.remove('dragging');
    const dy = (typeof e.clientY === 'number' ? e.clientY : dragStartY) - dragStartY;

    if (Math.abs(dy) < 6) {
      // ほぼ動いていない場合はタップとみなし、次の状態へ順送りする
      const idx = SHEET_STATES.indexOf(sheetState);
      const next = idx >= SHEET_STATES.length - 1 ? 'sheet-peek' : SHEET_STATES[idx + 1];
      setSheetState(next);
      return;
    }

    // 一番近いスナップ位置（peek / half / full）を選ぶ
    let bestState = sheetState;
    let bestDist = Infinity;
    SHEET_STATES.forEach(state => {
      const dist = Math.abs(lastPx - sheetPxForState(state));
      if (dist < bestDist) { bestDist = dist; bestState = state; }
    });
    setSheetState(bestState);
  }

  sheetHandle.addEventListener('pointerup', endSheetDrag);
  sheetHandle.addEventListener('pointercancel', endSheetDrag);
}

map.on('movestart', () => {
  if (isMobileViewport() && sheetState !== 'sheet-peek') {
    setSheetState('sheet-peek');
  }
});

// URLに保存されていたカテゴリ選択状態を復元する
restoredCatsList.forEach(cat => {
  const row = catRowMap[cat];
  if (!row) return;
  const groupEl = row.closest('.legend-group');
  if (groupEl) {
    groupEl.classList.add('expanded');
    const header = groupEl.querySelector('.legend-group-header');
    if (header) header.setAttribute('aria-expanded', 'true');
  }
  toggleCategory(cat, row);
});

renderFacList();

if (!hasRestoredView && allMarkers.length > 0) {
  const group = L.featureGroup(allMarkers);
  map.fitBounds(group.getBounds().pad(0.2));
}
</script>
</body>
